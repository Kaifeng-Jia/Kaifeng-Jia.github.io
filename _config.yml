# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.

############################
# Required Configuration
############################

# Basic Information
title: Kaifeng Jia
position: M.Eng. Student in Electrical and Computer Engineering
affiliation: Cornell University
affiliation_link: https://www.cornell.edu/

# your profile picture
avatar: ./assets/img/profile.jpg

# Sidebar Links
email: kj366@cornell.edu
github_link: https://github.com/Kaifeng-Jia

# Search Engine Optimization (SEO)
description: Academic personal homepage of Kaifeng Jia, an M.Eng. student in Electrical and Computer Engineering at Cornell University interested in robotics and robot learning.
keywords: Kaifeng Jia, Cornell University, robotics, robot learning, electrical and computer engineering
canonical: https://kaifeng-jia.github.io/


############################
# Optional Configuration
############################

# Customization
# option to choose between Serif or Sans Serif fonts.
font: "Sans Serif" # "Serif" or "Sans Serif"
# option to disable the footnote, "Powered by Jekyll and Minimal Light theme."
enable_footnote: true
# option to toggle the automatic dark theme
auto_dark_mode: true
# option to make avatar (profile photo) round vs rectangular
round_avatar: false
# option to show thumbnail or "teaser" figure next to each publication
enable_publication_thumbnails: true
enable_notes_thumbnails: false
# "favicon" and "favicon_dark" are used for the light and dark modes, respectively.
favicon: ./assets/img/favicon.png
favicon_dark: ./assets/img/favicon-dark.png


############################
# Fixed Configuration (ignore this for non-experts)
############################

# Build settings
markdown: kramdown
kramdown:
  syntax_highlighter: rouge

# The following files will be removed from the generated website.
exclude:
  - Gemfile
  - Gemfile.lock
  - html_site/
  - LICENSE
  - README.md
  - minimal-light.gemspec
  - vendor/
